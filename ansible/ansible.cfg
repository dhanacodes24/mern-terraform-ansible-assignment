[defaults]
inventory            = inventory/hosts.ini
remote_user          = ubuntu
private_key_file     = ~/.ssh/mern-key
interpreter_python   = auto_silent
retry_files_enabled  = False
# Uncomment after you create a .vault_pass file (it is git-ignored) to skip typing the vault password:
vault_password_file = .vault_pass
 
[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
 
[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

