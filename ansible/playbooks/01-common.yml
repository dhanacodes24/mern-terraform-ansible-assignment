---
- name: Base setup for ALL servers
  hosts: all
  become: true
 
  tasks:
    - name: Update apt cache and apply safe upgrades
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
        cache_valid_time: 3600
        lock_timeout: 180
 
    - name: Install common packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - ufw
          - fail2ban
          - unattended-upgrades
          - htop
          - vim
        state: present
        lock_timeout: 180
 
    - name: Make sure fail2ban is running and starts on boot
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

